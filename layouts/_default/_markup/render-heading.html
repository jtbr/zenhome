{{- /* The link follows the text so it can sit inline after it on narrow screens;
       on wide screens it is absolutely positioned into the left margin. */ -}}
<h{{ .Level }} id="{{ .Anchor }}">
  {{- .Text | safeHTML -}}
  {{- if or (eq .Level 2) (eq .Level 3) -}}
  <a class="anchor-link" href="#{{ .Anchor }}" aria-label="Copy link to section"><i class="ri-link" aria-hidden="true"></i></a>
  {{- end -}}
</h{{ .Level }}>
